[project]
name = "proyecto-integrador"
version = "0.1.0"
description = "Sistema de Control de Inventario con API REST y herramientas MCP"
authors = [
    { name = "xavix46", email = "xavieranatoa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt<4.1",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "mcp[cli]<2",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
